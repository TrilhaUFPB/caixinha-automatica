name: Process Payments

on:
  schedule:
    # Daily reconciliation at 8am BRT (11:00 UTC) - fallback for webhook
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for payments'
        required: false
        default: '3'
        type: string

jobs:
  process-payments:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json

      - name: Setup Efí certificate
        run: |
          echo "${{ secrets.EFI_CERTIFICATE_BASE64 }}" | base64 -d > certificado.pem

      - name: Run payment processing job
        env:
          EFI_CLIENT_ID: ${{ secrets.EFI_CLIENT_ID }}
          EFI_CLIENT_SECRET: ${{ secrets.EFI_CLIENT_SECRET }}
          EFI_CERTIFICATE_PATH: certificado.pem
          EFI_PIX_KEY: ${{ secrets.EFI_PIX_KEY }}
          GOOGLE_CREDENTIALS_PATH: credentials.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          DAYS="${{ github.event.inputs.days_back }}"
          if [ -z "$DAYS" ]; then
            DAYS="3"
          fi
          python -m src.jobs.process_payments --days "$DAYS"

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json certificado.pem
