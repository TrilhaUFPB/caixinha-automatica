name: Send Charges

on:
  schedule:
    # Runs at 12:00 UTC (9:00 AM BRT) on days 1-10 of each month
    # The job itself checks if it's the 5th business day
    - cron: '0 12 1-10 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even if not the 5th business day'
        required: false
        default: 'false'
        type: boolean

jobs:
  send-charges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run charge email job
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PIX_KEY: ${{ secrets.PIX_KEY }}
          PIX_KEY_TYPE: ${{ vars.PIX_KEY_TYPE || 'email' }}
          PIX_BENEFICIARY_NAME: ${{ vars.PIX_BENEFICIARY_NAME || 'Trilha UFPB' }}
          GOOGLE_FORM_URL: ${{ secrets.GOOGLE_FORM_URL }}
          DEFAULT_CHARGE_AMOUNT: ${{ vars.DEFAULT_CHARGE_AMOUNT || '40.00' }}
          TECPRED_CHARGE_AMOUNT: ${{ vars.TECPRED_CHARGE_AMOUNT || '25.00' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m src.jobs.send_charges --force
          else
            python -m src.jobs.send_charges
          fi
